name: Native platform comments

on:
  workflow_dispatch:
  push:
    branches: [main, "codex/**"]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Materialize upstream Git LFS objects
        run: |
          git lfs install
          git remote add futo-lfs https://gitlab.futo.org/videostreaming/grayjay.git
          git lfs fetch futo-lfs 993a9bd850f022f952460b1dfc0744b98e0c23b4
          git lfs checkout

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Set CI application version
        shell: bash
        run: |
          echo "GRAYJAY_VERSION_CODE=$((100000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"
          echo "GRAYJAY_VERSION_NAME=0.2.0-dev.${GITHUB_RUN_NUMBER}+${GITHUB_SHA:0:7}" >> "$GITHUB_ENV"

      - name: Restore persistent development signing key
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          GRAYJAY_DEBUG_KEYSTORE_BASE64: ${{ secrets.GRAYJAY_DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [[ -z "$GRAYJAY_DEBUG_KEYSTORE_BASE64" ]]; then
            echo "::warning::GRAYJAY_DEBUG_KEYSTORE_BASE64 is not configured; this run will use an ephemeral debug certificate"
            exit 0
          fi

          mkdir -p "$HOME/.android"
          printf '%s' "$GRAYJAY_DEBUG_KEYSTORE_BASE64" | base64 --decode > "$HOME/.android/debug.keystore"
          chmod 600 "$HOME/.android/debug.keystore"

      - name: Verify native-platform implementation
        run: ./scripts/verify-native-platform-comments.sh

      - name: Assemble debug variants
        run: ./gradlew :app:assembleStableDebug :app:assembleUnstableDebug

      - name: Prepare installable development APK
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/unstable/debug/app-unstable-universal-debug.apk \
            dist/grayjay-native-comments-unstable-debug.apk
          cd dist
          sha256sum grayjay-native-comments-unstable-debug.apk \
            > grayjay-native-comments-unstable-debug.apk.sha256
          {
            echo "repository=$GITHUB_REPOSITORY"
            echo "commit=$GITHUB_SHA"
            echo "run_id=$GITHUB_RUN_ID"
            echo "version_name=$GRAYJAY_VERSION_NAME"
            echo "version_code=$GRAYJAY_VERSION_CODE"
            echo "application_id=com.futo.platformplayer.d"
            echo "build_type=debug"
            echo "browser_package=enabled_by_BuildConfig.DEBUG"
          } > build-info.txt

      - name: Upload development APK
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: grayjay-native-comments-development-${{ github.run_number }}
          path: dist/
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  publish-development-release:
    needs: verify
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
    steps:
      - name: Download verified APK artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: grayjay-native-comments-development-${{ github.run_number }}
          path: dist

      - name: Publish GitHub prerelease
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="native-comments-dev-${GITHUB_RUN_NUMBER}"
          version="0.2.0-dev.${GITHUB_RUN_NUMBER}+${GITHUB_SHA:0:7}"
          notes="Unofficial development APK for testing native platform comments and reactions. This is the unstableDebug variant; it installs as com.futo.platformplayer.d and enables the optional Browser package through Grayjay's existing BuildConfig.DEBUG gate. See build-info.txt and the SHA-256 attachment for provenance and verification."

          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" \
              dist/grayjay-native-comments-unstable-debug.apk \
              dist/grayjay-native-comments-unstable-debug.apk.sha256 \
              dist/build-info.txt \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
            gh release edit "$tag" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "Grayjay native comments development ${version}" \
              --prerelease \
              --notes "$notes"
          else
            gh release create "$tag" \
              dist/grayjay-native-comments-unstable-debug.apk \
              dist/grayjay-native-comments-unstable-debug.apk.sha256 \
              dist/build-info.txt \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "Grayjay native comments development ${version}" \
              --prerelease \
              --notes "$notes"
          fi
