name: Native platform comments

on:
  workflow_dispatch:
  push:
    branches: [main, "codex/**"]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Materialize upstream Git LFS objects
        run: |
          git lfs install
          git remote add futo-lfs https://gitlab.futo.org/videostreaming/grayjay.git
          git lfs fetch futo-lfs 993a9bd850f022f952460b1dfc0744b98e0c23b4
          git lfs checkout

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Verify native-platform implementation
        run: ./scripts/verify-native-platform-comments.sh

      - name: Assemble debug variants
        run: ./gradlew :app:assembleStableDebug :app:assembleUnstableDebug
